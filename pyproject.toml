[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redkit"
version = "0.1.0"
description = "Scope-guarded offensive security toolkit for authorized penetration tests - built for Kali NetHunter on Android."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "redkit contributors" }]
requires-python = ">=3.9"
keywords = ["security", "pentest", "nethunter", "recon", "scanner"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
redkit = "redkit.cli:main"

[tool.setuptools.packages.find]
include = ["redkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
