[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eis-core"
version = "0.1.0"
description = "E.I.S. Core - lightweight technician, diagnostic, repair and utility platform for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "E.I.S. Community" }]
keywords = ["technician", "diagnostics", "repair", "windows", "tkinter", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Diagnostics",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
psutil = ["psutil"]
dev = ["pytest>=8.0"]

[project.gui-scripts]
eis-core = "eis.app:main"

[tool.setuptools.packages.find]
include = ["eis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
